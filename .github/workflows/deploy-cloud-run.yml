name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'saturn' }}
  CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE || 'saturn-backend' }}
  IMAGE_NAME: saturn-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build image tag
        id: image
        run: |
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.uri }}

      - name: Render runtime env file
        env:
          DEFAULT_ORG_ID: ${{ vars.DEFAULT_ORG_ID }}
          DEFAULT_ACTOR_ID: ${{ vars.DEFAULT_ACTOR_ID }}
          SEED_USER_NAME: ${{ vars.SEED_USER_NAME }}
          SESSION_TTL_DAYS: ${{ vars.SESSION_TTL_DAYS }}
          CORS_ORIGINS: https://dashboard.saturn-core.com
          PUBLIC_WS_URL: https://api.saturn-core.com
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {
              "EXPOSE_API_DOCS": "false",
              "DEFAULT_ORG_ID": os.environ.get("DEFAULT_ORG_ID") or "org_saturn",
              "DEFAULT_ACTOR_ID": os.environ.get("DEFAULT_ACTOR_ID") or "user_operator",
              "SEED_USER_NAME": os.environ.get("SEED_USER_NAME") or "Admin",
              "SESSION_TTL_DAYS": os.environ.get("SESSION_TTL_DAYS") or "7",
              "CORS_ORIGINS": os.environ["CORS_ORIGINS"],
              "PUBLIC_WS_URL": os.environ["PUBLIC_WS_URL"],
              "SATURN_KMS_KEY": "projects/project-5ae7d09e-f273-4da2-891/locations/asia-east1/keyRings/saturn/cryptoKeys/kem-root/cryptoKeyVersions/1",
              "SATURN_EMBED_WORKER": "false",
          }
          Path("cloud-run.env.yaml").write_text(
              "".join(f'{key}: "{value}"\n' for key, value in values.items()),
              encoding="utf-8",
          )
          values["SATURN_EMBED_WORKER"] = "true"
          Path("cloud-run.worker.env.yaml").write_text(
              "".join(f'{key}: "{value}"\n' for key, value in values.items()),
              encoding="utf-8",
          )
          PY

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --timeout 300 \
            --no-session-affinity \
            --cpu 1 \
            --memory 512Mi \
            --env-vars-file cloud-run.env.yaml \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,SEED_USER_EMAIL=SEED_USER_EMAIL:latest,SEED_USER_PASSWORD=SEED_USER_PASSWORD:latest,SATURN_GITHUB_OAUTH_CLIENT_ID=SATURN_GITHUB_OAUTH_CLIENT_ID:latest,SATURN_GITHUB_OAUTH_CLIENT_SECRET=SATURN_GITHUB_OAUTH_CLIENT_SECRET:latest,SATURN_GOOGLE_OAUTH_CLIENT_ID=SATURN_GOOGLE_OAUTH_CLIENT_ID:latest,SATURN_GOOGLE_OAUTH_CLIENT_SECRET=SATURN_GOOGLE_OAUTH_CLIENT_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RESEND_FROM=RESEND_FROM:latest,POLICY_LLM_BASE_URL=POLICY_LLM_BASE_URL:latest,POLICY_LLM_API_KEY=POLICY_LLM_API_KEY:latest,POLICY_LLM_MODEL=POLICY_LLM_MODEL:latest \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}" \
            --vpc-connector "${{ vars.SERVERLESS_VPC_CONNECTOR }}" \
            --vpc-egress private-ranges-only \
            --startup-probe=timeoutSeconds=10,periodSeconds=10,failureThreshold=36,tcpSocket.port=8000

      - name: Deploy webhook worker
        run: |
          gcloud run deploy saturn-worker \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}" \
            --platform managed \
            --no-allow-unauthenticated \
            --ingress internal \
            --port 8000 \
            --timeout 300 \
            --min-instances 1 \
            --max-instances 1 \
            --no-cpu-throttling \
            --cpu 1 \
            --memory 512Mi \
            --env-vars-file cloud-run.worker.env.yaml \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,REDIS_URL=REDIS_URL:latest,SEED_USER_EMAIL=SEED_USER_EMAIL:latest,SEED_USER_PASSWORD=SEED_USER_PASSWORD:latest,SATURN_GITHUB_OAUTH_CLIENT_ID=SATURN_GITHUB_OAUTH_CLIENT_ID:latest,SATURN_GITHUB_OAUTH_CLIENT_SECRET=SATURN_GITHUB_OAUTH_CLIENT_SECRET:latest,SATURN_GOOGLE_OAUTH_CLIENT_ID=SATURN_GOOGLE_OAUTH_CLIENT_ID:latest,SATURN_GOOGLE_OAUTH_CLIENT_SECRET=SATURN_GOOGLE_OAUTH_CLIENT_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RESEND_FROM=RESEND_FROM:latest,POLICY_LLM_BASE_URL=POLICY_LLM_BASE_URL:latest,POLICY_LLM_API_KEY=POLICY_LLM_API_KEY:latest,POLICY_LLM_MODEL=POLICY_LLM_MODEL:latest \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}" \
            --vpc-connector "${{ vars.SERVERLESS_VPC_CONNECTOR }}" \
            --vpc-egress private-ranges-only \
            --startup-probe=timeoutSeconds=10,periodSeconds=10,failureThreshold=36,tcpSocket.port=8000
