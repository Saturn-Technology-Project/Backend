name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'saturn' }}
  CLOUD_RUN_SERVICE: ${{ vars.BACKEND_CLOUD_RUN_SERVICE || 'saturn-backend' }}
  IMAGE_NAME: saturn-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet

      - name: Build image tag
        id: image
        run: |
          IMAGE_URI="${GAR_LOCATION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}

      - name: Render runtime env file
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DEFAULT_ORG_ID: ${{ vars.DEFAULT_ORG_ID }}
          DEFAULT_ACTOR_ID: ${{ vars.DEFAULT_ACTOR_ID }}
          SEED_USER_EMAIL: ${{ secrets.SEED_USER_EMAIL }}
          SEED_USER_NAME: ${{ vars.SEED_USER_NAME }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SESSION_TTL_DAYS: ${{ vars.SESSION_TTL_DAYS }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          PUBLIC_WS_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          SATURN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.SATURN_GITHUB_OAUTH_CLIENT_ID }}
          SATURN_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.SATURN_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {
              "DATABASE_URL": os.environ["DATABASE_URL"],
              "REDIS_URL": os.environ["REDIS_URL"],
              "DEFAULT_ORG_ID": os.environ.get("DEFAULT_ORG_ID") or "org_saturn",
              "DEFAULT_ACTOR_ID": os.environ.get("DEFAULT_ACTOR_ID") or "user_operator",
              "SEED_USER_EMAIL": os.environ["SEED_USER_EMAIL"],
              "SEED_USER_NAME": os.environ.get("SEED_USER_NAME") or "Admin",
              "SEED_USER_PASSWORD": os.environ["SEED_USER_PASSWORD"],
              "SESSION_TTL_DAYS": os.environ.get("SESSION_TTL_DAYS") or "7",
          }
          cors = (os.environ.get("CORS_ORIGINS") or "").strip()
          if cors:
              values["CORS_ORIGINS"] = cors
          public_ws = (os.environ.get("PUBLIC_WS_URL") or "").strip()
          if public_ws:
              values["PUBLIC_WS_URL"] = public_ws
          github_client_id = (os.environ.get("SATURN_GITHUB_OAUTH_CLIENT_ID") or "").strip()
          github_client_secret = (os.environ.get("SATURN_GITHUB_OAUTH_CLIENT_SECRET") or "").strip()
          if github_client_id and github_client_secret:
              values["SATURN_GITHUB_OAUTH_CLIENT_ID"] = github_client_id
              values["SATURN_GITHUB_OAUTH_CLIENT_SECRET"] = github_client_secret
          Path("cloud-run.env.yaml").write_text(
              "".join(f'{key}: "{value}"\n' for key, value in values.items()),
              encoding="utf-8",
          )
          PY

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --image "${{ steps.image.outputs.uri }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --timeout 3600 \
            --session-affinity \
            --cpu 1 \
            --memory 512Mi \
            --env-vars-file cloud-run.env.yaml \
            --add-cloudsql-instances "${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}" \
            --vpc-connector "${{ vars.SERVERLESS_VPC_CONNECTOR }}" \
            --vpc-egress private-ranges-only \
            --startup-probe=timeoutSeconds=10,periodSeconds=10,failureThreshold=36,tcpSocket.port=8000
