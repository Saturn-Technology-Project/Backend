name: Test

on:
  push:
    branches:
      - main
  pull_request:
  # deploy-cloud-run.yml runs this same job before it deploys.
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from that release's checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so gitleaks scans every commit and not only the tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -sSfL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" dir . --config .gitleaks.toml --no-banner --redact
          "${RUNNER_TEMP}/gitleaks" git . --config .gitleaks.toml --no-banner --redact

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Pytest
        run: pytest
